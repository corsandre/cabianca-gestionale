services:
  web:
    build: .
    image: cabianca-gestionale:latest
    pull_policy: build          # immagine locale: mai scaricarla da internet
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./app/static/uploads:/app/app/static/uploads
    env_file:
      - .env
    restart: unless-stopped

  # Sorveglianza dell'impianto di alimentazione (vedi app/services/impianto/servizio.py).
  # In modalità "Manuale" (default) non si collega a niente e resta in attesa.
  # Stessa immagine del gestionale (costruita dal servizio web), parte dopo di lui.
  impianto:
    image: cabianca-gestionale:latest
    pull_policy: never
    depends_on:
      - web
    command: python -m app.services.impianto.servizio
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - RUOLO=impianto
    restart: unless-stopped

# La rete ZeroTier verso il PC dell'impianto ha pacchetti da 1280 byte: con i 1500 standard di
# Docker le risposte più grandi di un pacchetto (es. la fotografia dello schermo) si perdono.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: 1280
