services:
  web:
    build: .
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./app/static/uploads:/app/app/static/uploads
    env_file:
      - .env
    restart: unless-stopped

  # Sorveglianza dell'impianto di alimentazione (vedi app/services/impianto/servizio.py).
  # In modalità "Manuale" (default) non si collega a niente e resta in attesa.
  impianto:
    build: .
    command: python -m app.services.impianto.servizio
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - RUOLO=impianto
    restart: unless-stopped
